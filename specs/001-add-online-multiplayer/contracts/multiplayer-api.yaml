openapi: 3.1.0
info:
  title: Multiplayer Signalling API
  version: 1.0.0
  description: Minimal Express-powered STUN/signalling helper for the online multiplayer takeover feature.
servers:
  - url: http://localhost:3333
paths:
  /signalling/offer:
    post:
      summary: Submit a WebRTC offer from a connecting peer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                inviteToken:
                  type: string
                  description: Game-instance+party token shared over the invite link
                alias:
                  type: string
                  description: Remote player's chosen name before taking over
                peerId:
                  type: string
                  description: Generated identifier for this peer session
                offer:
                  type: string
                  description: Base64 encoded SDP offer
              required: [inviteToken, alias, peerId, offer]
      responses:
        '200':
          description: Offer accepted and queued for the host to answer
  /signalling/answer:
    post:
      summary: Host posts the WebRTC answer for a pending peer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                inviteToken:
                  type: string
                peerId:
                  type: string
                answer:
                  type: string
              required: [inviteToken, peerId, answer]
      responses:
        '200':
          description: Answer relayed back to the connecting peer
  /signalling/candidate:
    post:
      summary: Exchange ICE candidates between host and peer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                inviteToken:
                  type: string
                peerId:
                  type: string
                candidate:
                  type: string
                  description: JSON string of RTCIceCandidate
              required: [inviteToken, peerId, candidate]
      responses:
        '204':
          description: Candidate stored for the matching peer
  /game-instance/:instanceId/invite-regenerate:
    post:
      summary: Generate new invite tokens when a non-host loads a save
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                partyId:
                  type: string
                  description: Party that needs a new invite/token
              required: [partyId]
      responses:
        '200':
          description: Returns the long invite token and that party's short code
          content:
            application/json:
              schema:
                type: object
                properties:
                  inviteToken:
                    type: string
                  shortCode:
                    type: string
                    description: 6-character code, unambiguous alphabet, unique among active invites
                  expiresAt:
                    type: number
                    description: Unix milliseconds when the token and short code expire together
  /signalling/invite-code/:code:
    get:
      summary: Resolve a short invite code to the long invite token
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: Short code. Case, spaces, and dashes are ignored.
      responses:
        '200':
          description: Active invite for that code
          content:
            application/json:
              schema:
                type: object
                properties:
                  inviteToken:
                    type: string
                  shortCode:
                    type: string
                  expiresAt:
                    type: number
        '404':
          description: Unknown or expired code
  /signalling/invite-code:
    post:
      summary: Store a short code for an existing long invite token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                instanceId:
                  type: string
                partyId:
                  type: string
                inviteToken:
                  type: string
              required: [instanceId, partyId, inviteToken]
      responses:
        '200':
          description: Short code saved in the signalling store
          content:
            application/json:
              schema:
                type: object
                properties:
                  inviteToken:
                    type: string
                  shortCode:
                    type: string
                  expiresAt:
                    type: number
        '400':
          description: Missing instanceId, partyId, or inviteToken
    delete:
      summary: Drop the active short code for one party
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                instanceId:
                  type: string
                partyId:
                  type: string
              required: [instanceId, partyId]
      responses:
        '204':
          description: Code released
  /presence:
    post:
      summary: Anonymous presence heartbeat
      description: Stores an anonymous session id and status. Returns approximate player totals. No alias or address is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
                status:
                  type: string
                  enum: [menu, single-player, mp-host, mp-client, looking-for-match]
                openInviteToken:
                  type: string
                  description: Long invite token for one free slot, or omitted when the host is not listed.
              required: [sessionId, status]
      responses:
        '200':
          description: Totals for sessions seen in the last 90 seconds. Deploy previews also include `backend`, `storage`, `redisConfigured`, and `handler`. Production omits those fields.
        '400':
          description: Invalid session id or status
        '429':
          description: Per-session rate limit
  /quick-match:
    post:
      summary: Claim one open host slot
      description: Skips the caller's own host and hosts with no heartbeat for 90 seconds. The returned token joins through the normal invite link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
              required: [sessionId]
      responses:
        '200':
          description: Claimed invite token, or inviteToken null when none is open
        '429':
          description: Per-session rate limit
**NOTE**: This API lives inside the minimal Express helper and the Netlify `/api` function and is used only for the initial WebRTC handshake; all actual game state remains inside the host browser. The presence and quick-match routes prefer a Netlify edge function with Upstash Redis and fall back to this function's Netlify Blobs store.
