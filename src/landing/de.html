<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code for Battle</title>
  <meta name="description" content="" data-i18n-content="landing.meta.description">
  <meta name="theme-color" content="#060c1a">
  <link rel="canonical" href="/de/landing">
  <link rel="alternate" hreflang="en" href="/en/landing">
  <link rel="alternate" hreflang="de" href="/de/landing">
  <link rel="alternate" hreflang="x-default" href="/en/landing">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Code for Battle" data-i18n-content="landing.meta.title">
  <meta property="og:description" content="" data-i18n-content="landing.meta.description">
  <meta property="og:image" content="/images/docs/GamePlayDesktop.webp">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/landing/landing.css">
</head>

<body data-landing-page="true" data-landing-locale="de">
  <div class="landing-backdrop" aria-hidden="true">
    <div class="landing-backdrop__shift">
      <picture>
        <source media="(max-width: 700px)" srcset="/images/docs/GamePlayBackdropMobile.webp" type="image/webp">
        <img
          src="/images/docs/GamePlayBackdrop.webp"
          alt=""
          width="1920"
          height="1080"
          decoding="async"
          fetchpriority="low">
      </picture>
    </div>
  </div>
  <div class="landing-scrim" aria-hidden="true"></div>
  <a class="skip-link" href="#content" data-i18n="landing.nav.skip"></a>
  <header class="landing-bar">
    <a class="landing-brand" href="/" data-i18n="landing.hero.title"></a>
    <div class="landing-bar-nav">
      <nav class="landing-section-nav" data-i18n-aria="landing.nav.sectionsLabel">
        <a href="#gallery" data-i18n="landing.nav.gallery"></a>
        <a href="#features" data-i18n="landing.nav.features"></a>
        <a href="#multiplayer" data-i18n="landing.nav.multiplayer"></a>
        <a href="#controllers" data-i18n="landing.nav.controllers"></a>
        <a href="#vibe" data-i18n="landing.nav.vibe"></a>
        <a href="#tech" data-i18n="landing.nav.tech"></a>
      </nav>
      <nav class="landing-lang" data-i18n-aria="landing.nav.languageLabel">
        <a href="/en/landing" data-locale-link="en" hreflang="en" lang="en" data-i18n="landing.nav.english"></a>
        <a href="/de/landing" data-locale-link="de" hreflang="de" lang="de" data-i18n="landing.nav.german"></a>
      </nav>
      <a class="landing-github" href="https://github.com/theSystem85/code-for-battle" target="_blank" rel="noopener noreferrer">
        <svg class="landing-github__mark" viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M8 0c-4.42 0-8 3.58-8 8 0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
        </svg>
        <span data-i18n="landing.nav.github"></span>
      </a>
      <a class="landing-cta" href="/" data-play-link data-i18n="landing.nav.play"></a>
    </div>
  </header>
  <main id="content" class="landing-main">
    <section class="hero">
      <div>
        <p class="eyebrow" data-i18n="landing.hero.eyebrow"></p>
        <h1 data-i18n="landing.hero.title"></h1>
        <p class="tagline" data-i18n="landing.hero.tagline"></p>
        <p class="lead" data-i18n="landing.hero.lead"></p>
        <div class="hero-actions">
          <a class="landing-cta" href="/" data-play-link data-i18n="landing.hero.cta"></a>
          <a class="landing-cta-secondary" href="#features" data-i18n="landing.hero.secondary"></a>
        </div>
        <ul class="roster" aria-hidden="true">
          <li><img src="/images/sidebar/tank.webp" alt="" width="64" height="64"></li>
          <li><img src="/images/sidebar/harvester.webp" alt="" width="64" height="64"></li>
          <li><img src="/images/sidebar/apache_sidebar.webp" alt="" width="64" height="64"></li>
          <li><img src="/images/sidebar/f22_raptor_sidebar.webp" alt="" width="64" height="64"></li>
          <li><img src="/images/sidebar/battleship_sidebar.webp" alt="" width="64" height="64"></li>
          <li><img src="/images/sidebar/tesla_coil.webp" alt="" width="64" height="64"></li>
        </ul>
      </div>
      <figure class="hero-frame">
        <img
          src="/images/docs/GamePlayDesktop.webp"
          width="1254"
          height="784"
          data-i18n-alt="landing.gallery.desktop.alt"
          fetchpriority="high"
          decoding="async">
      </figure>
    </section>

    <section id="gallery" class="landing-section">
      <h2 data-i18n="landing.gallery.title"></h2>
      <p class="section-lead" data-i18n="landing.gallery.lead"></p>
      <div class="gallery">
        <figure class="shot shot--desktop">
          <img
            src="/images/docs/GamePlayDesktop.webp"
            width="1254"
            height="784"
            alt=""
            data-i18n-alt="landing.gallery.desktop.alt"
            loading="lazy"
            decoding="async">
          <figcaption data-i18n="landing.gallery.desktop.caption"></figcaption>
        </figure>
        <figure class="shot shot--landscape">
          <img
            src="/images/docs/GamePlayLandscape.webp"
            width="845"
            height="392"
            alt=""
            data-i18n-alt="landing.gallery.landscape.alt"
            loading="lazy"
            decoding="async">
          <figcaption data-i18n="landing.gallery.landscape.caption"></figcaption>
        </figure>
        <figure class="shot shot--portrait">
          <img
            src="/images/docs/GamePlayPortrait.webp"
            width="391"
            height="846"
            alt=""
            data-i18n-alt="landing.gallery.portrait.alt"
            loading="lazy"
            decoding="async">
          <figcaption data-i18n="landing.gallery.portrait.caption"></figcaption>
        </figure>
      </div>
    </section>

    <section id="features" class="landing-section">
      <h2 data-i18n="landing.features.title"></h2>
      <p class="section-lead" data-i18n="landing.features.lead"></p>
      <div class="feature-grid" data-landing-features></div>
    </section>

    <section id="multiplayer" class="landing-section">
      <h2 data-i18n="landing.multiplayer.title"></h2>
      <p class="section-lead" data-i18n="landing.multiplayer.lead"></p>
      <div class="feature-grid">
        <article class="feature-card hud-panel">
          <h3 data-i18n="landing.multiplayer.hostTitle"></h3>
          <p data-i18n="landing.multiplayer.hostBody"></p>
        </article>
        <article class="feature-card hud-panel">
          <h3 data-i18n="landing.multiplayer.partiesTitle"></h3>
          <p data-i18n="landing.multiplayer.partiesBody"></p>
        </article>
        <article class="feature-card hud-panel">
          <h3 data-i18n="landing.multiplayer.lockstepTitle"></h3>
          <p data-i18n="landing.multiplayer.lockstepBody"></p>
        </article>
        <article class="feature-card hud-panel">
          <h3 data-i18n="landing.multiplayer.reconnectTitle"></h3>
          <p data-i18n="landing.multiplayer.reconnectBody"></p>
        </article>
        <article class="feature-card hud-panel">
          <h3 data-i18n="landing.multiplayer.devicesTitle"></h3>
          <p data-i18n="landing.multiplayer.devicesBody"></p>
        </article>
      </div>
    </section>

    <section id="controllers" class="landing-section">
      <h2 data-i18n="landing.controllers.title"></h2>
      <p class="section-lead" data-i18n="landing.controllers.lead"></p>
      <div class="feature-grid">
        <article class="feature-card hud-panel">
          <h3 data-i18n="landing.controllers.mapTitle"></h3>
          <p data-i18n="landing.controllers.mapBody"></p>
        </article>
        <article class="feature-card hud-panel">
          <h3 data-i18n="landing.controllers.profilesTitle"></h3>
          <p data-i18n="landing.controllers.profilesBody"></p>
        </article>
        <article class="feature-card hud-panel">
          <h3 data-i18n="landing.controllers.coopTitle"></h3>
          <p data-i18n="landing.controllers.coopBody"></p>
        </article>
        <article class="feature-card hud-panel">
          <h3 data-i18n="landing.controllers.defaultsTitle"></h3>
          <p data-i18n="landing.controllers.defaultsBody"></p>
        </article>
      </div>
    </section>

    <section id="vibe" class="landing-section">
      <h2 data-i18n="landing.vibe.title"></h2>
      <div class="hud-panel vibe-panel">
        <p class="lead" data-i18n="landing.vibe.lead"></p>
        <h3 data-i18n="landing.vibe.assetsTitle"></h3>
        <p class="section-lead" data-i18n="landing.vibe.assetsLead"></p>
        <div class="asset-grid" data-landing-assets></div>
      </div>
    </section>

    <section id="tech" class="landing-section">
      <h2 data-i18n="landing.tech.title"></h2>
      <p class="section-lead" data-i18n="landing.tech.lead"></p>
      <div data-landing-tech></div>
      <p class="tech-note" data-i18n="landing.tech.note"></p>
    </section>

    <footer class="landing-footer">
      <p data-i18n="landing.footer.rights"></p>
      <div class="landing-footer-links">
        <nav data-i18n-aria="landing.footer.navLabel">
          <a data-legal-link="imprint" href="/impressum" data-i18n="landing.footer.imprint"></a>
          <a data-legal-link="privacy" href="/datenschutz" data-i18n="landing.footer.privacy"></a>
          <a data-legal-link="contact" href="/kontakt" data-i18n="landing.footer.contact"></a>
          <a href="/docs/user-documentation.html" data-i18n="landing.nav.manual"></a>
          <a href="/" data-play-link data-i18n="landing.footer.play"></a>
        </nav>
        <a class="landing-github landing-github--footer" href="https://github.com/theSystem85/code-for-battle" target="_blank" rel="noopener noreferrer">
        <svg class="landing-github__mark" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M8 0c-4.42 0-8 3.58-8 8 0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
        </svg>
        <span data-i18n="landing.nav.github"></span>
      </a>
      </div>
    </footer>
  </main>
  <script type="module" src="/src/landing/landingPage.js"></script>
</body>

</html>
