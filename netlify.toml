[build]
  # Keep the committed lockfile. Deleting it and running a floating `npm install`
  # crashes current npm/arborist while resolving vitest optional peers
  # (`Cannot read properties of null (reading 'edgesOut')`) and fails the deploy.
  command = "npm ci --include=dev && npm run build && npm run test:smoke"
  publish = "dist"
  # Build production, the dev branch deploy, and all PR deploy previews
  # (including PRs into dev). Other branch deploys are skipped.
  # See AGENTS.md "Deployment".
  ignore = "node scripts/netlify-ignore.mjs"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API routes handled by Netlify Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

# Marketing landing pages. Pretty URLs also serve the built HTML files.
# /landing stays a small client redirect so a saved language choice wins
# over the browser default. English is the fallback locale.
[[redirects]]
  from = "/en/landing"
  to = "/en/landing.html"
  status = 200

[[redirects]]
  from = "/de/landing"
  to = "/de/landing.html"
  status = 200

[[redirects]]
  from = "/landing"
  to = "/landing.html"
  status = 200

[[redirects]]
  from = "/sse"
  to = "/sse.html"
  status = 200

[[redirects]]
  from = "/sse/"
  to = "/sse.html"
  status = 200

# SPA fallback for client-side routing
# force = false ensures functions and assets are served first
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# The service worker must revalidate on every visit so a deploy is noticed
# and unchanged hashed assets are not downloaded again. registerSW.js is
# covered for the plugin's optional register script even though this app
# registers /sw.js itself.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/offline-probe.txt"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/offline-assets-manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

# This mutable manifest is the dev live-update pointer. Netlify's edge cache
# must revalidate it; hashed CSS assets below remain immutable.
[[headers]]
  for = "/build-info.json"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    CDN-Cache-Control = "no-store"

[[headers]]
  for = "/game-update-manifest.json"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    CDN-Cache-Control = "no-store"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Lighthouse plugin for performance testing
# Runs automatically on all deploys including feature branches
[[plugins]]
  package = "@netlify/plugin-lighthouse"

  # Set minimum thresholds for each report area
  [plugins.inputs.thresholds]
    performance = 0.7
    accessibility = 0.1
    best-practices = 0.8
    seo = 0.1

  # Optional: deploy the lighthouse report to a path under your site
  [[plugins.inputs.audits]]
    output_path = "reports/lighthouse.html"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
